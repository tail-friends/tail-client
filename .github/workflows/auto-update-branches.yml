name: Auto-update PR branches

on:
  push:
    branches: [develop, main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-update-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update PR branches behind ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --repo "$REPO" --base "$BASE" --state open --json number --jq '.[].number'); do
            read -r head branch < <(gh pr view "$pr" --repo "$REPO" --json headRefOid,headRefName --jq '"\(.headRefOid) \(.headRefName)"')
            echo "Updating PR #$pr ($branch) against $BASE"
            if ! gh api --method PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$head"; then
              echo "Skip PR #$pr (already up to date or conflict)"
              continue
            fi
            # 봇 커밋으로 생긴 PR CI는 "첫 기여자 승인 대기"로 멈춘다. 새 커밋의 실행을 찾아 승인한다
            for i in $(seq 1 30); do
              new=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
              run=$(gh run list --repo "$REPO" --branch "$branch" --event pull_request \
                --json databaseId,headSha,conclusion \
                --jq "map(select(.headSha == \"$new\" and .conclusion == \"action_required\"))[0].databaseId // empty")
              if [ -n "$run" ]; then
                gh api --method POST "repos/$REPO/actions/runs/$run/approve" && echo "Approved CI run $run for PR #$pr"
                break
              fi
              sleep 2
            done
          done
